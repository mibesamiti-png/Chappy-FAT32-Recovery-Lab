name: Team B synthetic directory recovery tests

on:
  push:
    branches:
      - feature/b-directory-r1-20261111
    paths:
      - 'modules/directory/**'
      - 'tests/Test-DirectoryScanner.ps1'
      - '.github/workflows/team-b-synthetic.yml'
  pull_request:
    paths:
      - 'modules/directory/**'
      - 'tests/Test-DirectoryScanner.ps1'
      - '.github/workflows/team-b-synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directory-synthetic-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw "Expected Windows PowerShell 5.1"
          }
      - name: Run Team B synthetic-only regression
        shell: powershell
        run: .\tests\Test-DirectoryScanner.ps1
