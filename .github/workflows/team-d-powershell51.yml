name: Team D Windows PowerShell 5.1 synthetic tests
on:
  push:
    paths:
      - 'modules/fat-analysis/**'
      - '.github/workflows/team-d-powershell51.yml'
  pull_request:
    paths:
      - 'modules/fat-analysis/**'
      - '.github/workflows/team-d-powershell51.yml'
  workflow_dispatch:
jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run R1 artificial-image forensic tests on Windows PowerShell 5.1
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD.Tests.ps1
      - name: Run R2 in-memory synthetic FAT patch and rollback tests
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R2.Tests.ps1
      - name: Run R3 bounded FAT mirror comparison synthetic tests
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R3-Mirror.Tests.ps1
      - name: Run R3 bounded EB58 pattern and offset hypotheses synthetic tests
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R3-Eb58.Tests.ps1
      - name: Run R3 bounded FAT chain anomaly synthetic tests
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R3-ChainStats.Tests.ps1
      - name: Run R3 anonymous directory and FAT consistency synthetic tests
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R3-Consistency.Tests.ps1
      - name: Run R4 MBR BPB backup VBR FSInfo synthetic geometry tests
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R4-Geometry.Tests.ps1
      - name: Run R5 bounded primary backup VBR disagreement synthetic tests
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R5-Disagreement.Tests.ps1
      - name: Run R6 synthetic VBR hypothesis FAT mirror cross-evidence
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R6-MirrorVbr.Tests.ps1
      - name: Run R7 stratified FAT anomaly research same-fixture R6 A B tests
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R7-StratifiedAB.Tests.ps1
      - name: Run R8 additive FAT anomaly summed-budget synthetic A/B
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R8-AdditiveAB.Tests.ps1
      - name: Run R9 longer root cycles far FAT and unique coverage same-corpus synthetic A/B
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R9-LongCycleAB.Tests.ps1

      - name: Run Team D P02 FAT evidence handoff on synthetic images
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-P02Evidence.Tests.ps1
      - name: Run Team D R6 P2 synthetic fragmentation versus shared FAT cycles A B
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R6-FixtureChainAB.Tests.ps1
      - name: Run Team D R6 observed I O source span provenance artificial A B
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R6-ObservedIo.Tests.ps1
      - name: Run Team D R6 physical FAT read-span adversarial A B negatives
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R6-IntervalNegatives.Tests.ps1
      - name: Run Team D R6 synthetic cross-source FAT identity adversarial A B
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R6-SourceIdentity.Tests.ps1
      - name: Run Team D R6 dual FAT ambiguous mirror and chain synthetic A B
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R6-DualFatAmbiguity.Tests.ps1
      - name: Run Team D R6 synthetic FAT sampling blind spots A B
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R6-SamplingBlindspots.Tests.ps1
      - name: Run Team D R6 synthetic remote512 and displaced128 FAT schedule tradeoff
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R6-Remote512Tradeoff.Tests.ps1
      - name: Run Team D R6 synthetic multi-seed nonoracle rotating FAT window A B
        shell: powershell
        run: .\modules\fat-analysis\tests\Run-TeamD-R6-NonoracleRotatingWindows.Tests.ps1
